<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glove counter</title>
<style>
:root{--bg:#eef0ec;--card:#fff;--ink:#1d2623;--mute:#66726d;--line:#d6dbd5;--good:#1f7a5a;--bad:#c4501f;--ok:#2e9b4f;--off:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141916;--card:#1d2420;--ink:#e6ece8;--mute:#93a099;--line:#2f3a34;--good:#4cc794;--bad:#f08a57;--ok:#4cc77a;--off:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,sans-serif;padding:20px;max-width:1200px;margin-inline:auto}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0}
.badge{font-size:13px;padding:2px 10px;border:1px solid var(--line);border-radius:99px;color:var(--mute)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.sum b{display:block;font-size:26px;font-weight:600}.sum span{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.col-h{font-weight:600;color:var(--mute);margin:0 0 -6px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;padding:14px 16px}
.card.good{--c:var(--good)}.card.reject{--c:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center}
.top h2{font-size:16px;margin:0;color:var(--c)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--off)}
.dot.connected{background:var(--ok)}.dot.connecting{background:#d9a400}
.st{font-size:13px;color:var(--mute)}
.big{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.big b{font-size:56px;line-height:1;font-weight:600}.big span{color:var(--mute)}
.live{color:var(--mute);margin-bottom:10px}
.live b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0;font-size:13px}
.stats span{color:var(--mute);display:block}
.fill{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 2px}
.fill i{display:block;height:100%;background:var(--c)}
.fl{font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
.hist{display:flex;align-items:flex-end;gap:2px;height:54px;margin-top:10px}
.hist div{flex:1;background:var(--c);opacity:.75;min-height:1px;border-radius:2px 2px 0 0}
.hl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.note{margin-top:8px;padding:6px 10px;background:color-mix(in srgb,var(--bad) 15%,transparent);border-radius:4px;font-size:13px}
button,select,input{font:inherit;color:inherit}
button{background:none;border:1px solid var(--line);border-radius:5px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--mute)}button.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--good);outline-offset:2px}
details{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.cfg label{display:block;font-size:13px;color:var(--mute)}
.cfg input,.cfg select{width:100%;padding:5px 8px;background:var(--bg);border:1px solid var(--line);border-radius:5px;margin-top:2px}
.row{display:flex;gap:6px}.row input:first-child{flex:2}
</style>
</head>
<body>
<header>
  <h1>Glove counter</h1>
  <span class="badge" id="mode">connecting…</span>
</header>
<div class="sum" id="sum"></div>
<div class="grid">
  <p class="col-h">Right hand</p><p class="col-h">Left hand</p>
  <div id="good-right"></div><div id="good-left"></div>
  <div id="reject-right"></div><div id="reject-left"></div>
</div>

<details id="settings">
  <summary>Scale settings</summary>
  <div class="cfg">
    <label>Data source
      <select id="c-mode"><option value="simulator">Simulator (no hardware)</option><option value="tcp">Real scales (Ethernet)</option></select></label>
    <label>Simulator speed <input id="c-speed" type="number" min="0.5" max="3" step="0.5"></label>
    <label>Smallest glove counted (g) <input id="c-min" type="number" step="1"></label>
    <label>Largest glove counted (g) <input id="c-max" type="number" step="1"></label>
  </div>
  <div class="cfg" id="c-scales"></div>
  <button class="p" id="save">Save and reconnect</button>
  <button id="reset-all">Reset all counts</button>
</details>

<script>
const $ = (id) => document.getElementById(id);
const f = (v, d = 1) => (v === null || v === undefined || isNaN(v)) ? '–' : Number(v).toFixed(d);
let capacity = 6000, cfgBuilt = false;

function card(s) {
  const keys = Object.keys(s.hist).map(Number);
  let bars = '', lo = 0, hi = 0;
  if (keys.length) {
    lo = Math.min(...keys) - 1; hi = Math.max(...keys) + 1;
    const mx = Math.max(...Object.values(s.hist));
    for (let k = lo; k <= hi; k++) bars += `<div title="${k}–${k + 1} g: ${s.hist[k] || 0}" style="height:${Math.round(((s.hist[k] || 0) / mx) * 100)}%"></div>`;
  }
  const pct = Math.min(100, ((s.fill || 0) / capacity) * 100);
  return `<div class="card ${s.kind}">
    <div class="top"><h2>${s.label}</h2><span class="st"><i class="dot ${s.status}"></i>${s.status}</span></div>
    <div class="big num"><b>${s.n.toLocaleString()}</b><span>gloves</span></div>
    <div class="live num">On scale <b>${f(s.live)} g</b> · last glove <b>${f(s.last)} g</b></div>
    <div class="fill"><i style="width:${pct}%"></i></div>
    <div class="fl num"><span>Bin ${f((s.fill || 0) / 1000, 2)} kg of ${capacity / 1000} kg</span><span>emptied ${s.emptied}×</span></div>
    <div class="stats num">
      <div><span>Average</span>${f(s.mean)} g</div><div><span>Min</span>${f(s.min)} g</div>
      <div><span>Max</span>${f(s.max)} g</div><div><span>Std dev</span>${f(s.sd, 2)} g</div>
    </div>
    <div class="stats num"><div><span>Total weight</span>${f(s.sum / 1000, 2)} kg</div></div>
    <div class="hist">${bars}</div>
    ${keys.length ? `<div class="hl num"><span>${lo} g</span><span>weight spread</span><span>${hi + 1} g</span></div>` : ''}
    ${s.note ? `<div class="note">${s.note}</div>` : ''}
    <div style="margin-top:8px"><button data-reset="${s.id}">Reset this bin</button></div>
  </div>`;
}

function render(d) {
  capacity = d.capacity;
  $('mode').textContent = d.mode === 'tcp' ? 'Live scales' : 'Simulator: fake data';
  const S = d.scales, g = (k) => S[k] ? S[k].n : 0;
  const rate = (a, b) => (g(a) + g(b)) ? (100 * g(b) / (g(a) + g(b))) : 0;
  const goodT = g('good-right') + g('good-left'), badT = g('reject-right') + g('reject-left');
  $('sum').innerHTML = `
    <div><b class="num">${goodT.toLocaleString()}</b><span>Good gloves</span></div>
    <div><b class="num">${badT.toLocaleString()}</b><span>Rejected gloves</span></div>
    <div><b class="num">${f(rate('good-right', 'reject-right'))}%</b><span>Right hand reject rate</span></div>
    <div><b class="num">${f(rate('good-left', 'reject-left'))}%</b><span>Left hand reject rate</span></div>
    <div><b class="num">${f(goodT + badT ? 100 * badT / (goodT + badT) : 0)}%</b><span>Overall reject rate</span></div>`;
  for (const id in S) $(id).innerHTML = card(S[id]);
}

new EventSource('/events').onmessage = (e) => render(JSON.parse(e.data));

document.addEventListener('click', async (e) => {
  const id = e.target.dataset && e.target.dataset.reset;
  if (id && confirm('Reset the count for this bin?')) await fetch('/api/reset', { method: 'POST', body: JSON.stringify({ id }) });
});
$('reset-all').onclick = async () => { if (confirm('Reset ALL four bins?')) await fetch('/api/reset', { method: 'POST', body: '{}' }); };

async function loadCfg() {
  const c = await (await fetch('/api/config')).json();
  $('c-mode').value = c.mode; $('c-speed').value = c.simSpeed; $('c-min').value = c.glove.min; $('c-max').value = c.glove.max;
  $('c-scales').innerHTML = Object.entries(c.scales).map(([id, s]) =>
    `<label>${s.label}<div class="row"><input data-h="${id}" value="${s.host}" aria-label="${s.label} IP address"><input data-p="${id}" type="number" value="${s.port}" aria-label="${s.label} port"></div></label>`).join('');
}
$('save').onclick = async () => {
  const scales = {};
  document.querySelectorAll('[data-h]').forEach((i) => { scales[i.dataset.h] = { host: i.value.trim(), port: +document.querySelector(`[data-p="${i.dataset.h}"]`).value }; });
  await fetch('/api/config', { method: 'POST', body: JSON.stringify({ mode: $('c-mode').value, simSpeed: +$('c-speed').value, glove: { min: +$('c-min').value, max: +$('c-max').value }, scales }) });
  alert('Saved. Scales are reconnecting.');
};
loadCfg();
</script>
</body>
</html>
